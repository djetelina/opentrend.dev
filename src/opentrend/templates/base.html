<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}opentrend.dev{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}OpenTrend tracks open source adoption across GitHub, package registries, and 25+ OS distributions. Stars are one signal - reach is the full picture.{% endblock %}">
    <link rel="canonical" href="{% block canonical %}{{ site_url }}{% endblock %}">
    {# Open Graph / social #}
    <meta property="og:site_name" content="OpenTrend">
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ self.meta_description() }}{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ self.canonical() }}{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{{ site_url }}/og.png{% endblock %}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="{% block twitter_card %}summary_large_image{% endblock %}">
    <meta name="twitter:title" content="{{ self.og_title() }}">
    <meta name="twitter:description" content="{{ self.og_description() }}">
    <meta name="twitter:image" content="{{ self.og_image() }}">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ asset_v }}">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v={{ asset_v }}">
    <link rel="preload" href="/static/vendor/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/vendor/SymbolsNerdFontMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="/static/css/tailwind.css?v={{ asset_v }}">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_v }}">
    <script src="/static/vendor/htmx-2.0.4.min.js"></script>
</head>
<body class="bg-bg text-fg font-sans text-sm lg:text-base antialiased min-h-screen overflow-x-hidden">
    {% include "components/nav.html" %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% include "components/footer.html" %}
<script>
(function() {
    // HTMX: add CSRF token from meta tag to all requests
    document.body.addEventListener('htmx:configRequest', function(e) {
        var input = document.querySelector('input[name="_csrf_token"]');
        if (input) e.detail.headers['x-csrftoken'] = input.value;
    });
})();
</script>
</body>
</html>
